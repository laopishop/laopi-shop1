<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品管理後台</title>
  <!-- 引入 Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 15px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
    .card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    h2, h3 { margin: 0 0 15px 0; color: #333; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 100px; resize: vertical; }
    
    .btn-group { display: flex; gap: 10px; }
    button { padding: 10px 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-submit { background: #28a745; color: white; width: 100%; }
    .btn-cancel { background: #6c757d; color: white; display: none; }
    .btn-toggle { background: #ffc107; color: #212529; }
    .btn-edit { background: #17a2b8; color: white; }
    .btn-del { background: #dc3545; color: white; }
    .btn-logout { background: #6c757d; color: white; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #e9ecef; padding: 12px; text-align: left; }
    th { background: #f8f9fa; }
    .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
  </style>
</head>
<body>

  <div class="header">
    <h2>🛠️ 商品管理後台</h2>
    <button class="btn-logout" onclick="logout()">登出</button>
  </div>

  <!-- 新增/編輯商品表單區塊 -->
  <div class="card" id="formCard">
    <h3 id="formTitle">新增商品</h3>
    <form id="productForm">
      <input type="hidden" id="editProductId" value="">
      
      <input type="text" id="name" placeholder="商品名稱" required>
      <input type="number" id="price" placeholder="價格" required>
      <input type="text" id="category" placeholder="分類（例如：Free Fire / 軟體）">
      
      <label style="display:block; margin-bottom: 6px; font-weight: bold; color: #444;">商品圖片（可多選）：</label>
      <input type="file" id="imageFileInput" accept="image/*" multiple style="margin-bottom: 8px;">
      <input type="text" id="imageUrl" placeholder="圖片網址（上傳後會自動帶入，逗號分隔）" required>
      <div id="uploadStatus" style="color: #d97706; font-size: 13px; margin-bottom: 10px;"></div>

      <textarea id="description" placeholder="商品介紹（如：帳號綁定方式、詳細賣點）"></textarea>
      
      <div class="btn-group">
        <button type="submit" id="submitBtn" class="btn-submit">➕ 新增商品</button>
        <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">取消編輯</button>
      </div>
    </form>
  </div>

  <!-- 商品列表 -->
  <div class="card">
    <h3>商品列表</h3>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th style="width: 35%;">名稱</th>
            <th style="width: 20%;">價格</th>
            <th style="width: 15%;">狀態</th>
            <th style="width: 30%;">操作</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 1. 初始化 Supabase (填入你的連線資訊)
    const SUPABASE_URL = 'https://kjvzobgeqajfdoodnlac.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtqdnpvYmdlcWFqZmRvb2RubGFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTE4NzEsImV4cCI6MjEwMjg2Nzg3MX0.hzm2DiQTjeSliAsQZXCfSF1DdDNIIO2rvD2vJX-Geg4';// 請填入你的 Anon Public Key    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allProducts = [];

    async function check() {
      // 保持原有驗證邏輯
      try {
        const res = await fetch('/api/admin/check-auth');
        const data = await res.json();
        if (!data.authenticated) window.location.href = '/admin-login.html';
        else load();
      } catch (e) {
        load();
      }
    }

    // 從 Supabase 讀取資料（就算關電腦、伺服器重啟資料都不會不見）
    async function load() {
      const { data, error } = await _supabase
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('讀取失敗:', error);
        alert('讀取商品失敗');
        return;
      }

      allProducts = data || [];
      renderList();
    }

    function renderList() {
      document.getElementById('list').innerHTML = allProducts.map(p => `
        <tr>
          <td><b>${escapeHtml(p.name || p.title)}</b></td>
          <td>$${p.price}</td>
          <td><span style="color:${p.isActive ? '#28a745' : '#dc3545'}; font-weight:bold;">${p.isActive ? '上架' : '下架'}</span></td>
          <td>
            <div class="action-btns">
              <button class="btn-toggle" onclick="toggle(${p.id}, ${p.isActive})">${p.isActive ? '下架' : '上架'}</button>
              <button class="btn-edit" onclick="startEdit(${p.id})">編輯</button>
              <button class="btn-del" onclick="del(${p.id})">刪除</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function startEdit(id) {
      const p = allProducts.find(item => item.id === id);
      if (!p) return;

      document.getElementById('editProductId').value = p.id;
      document.getElementById('name').value = p.name || p.title || '';
      document.getElementById('price').value = p.price;
      document.getElementById('category').value = p.category || '';
      document.getElementById('imageUrl').value = p.imageUrl || '';
      document.getElementById('description').value = p.description || '';

      document.getElementById('formTitle').innerText = '✏️ 修改商品';
      document.getElementById('submitBtn').innerText = '💾 儲存修改';
      document.getElementById('submitBtn').style.background = '#0d6efd';
      document.getElementById('cancelBtn').style.display = 'block';

      document.getElementById('formCard').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      document.getElementById('editProductId').value = '';
      document.getElementById('productForm').reset();
      document.getElementById('uploadStatus').innerText = '';
      
      document.getElementById('formTitle').innerText = '新增商品';
      document.getElementById('submitBtn').innerText = '➕ 新增商品';
      document.getElementById('submitBtn').style.background = '#28a745';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    // 儲存（新增或修改直接寫入 Supabase 雲端資料庫）
    document.getElementById('productForm').onsubmit = async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const payload = {
        title: document.getElementById('name').value,
        price: Number(document.getElementById('price').value),
        category: document.getElementById('category').value,
        imageUrl: document.getElementById('imageUrl').value,
        description: document.getElementById('description').value
      };

      if (editId) {
        // 更新 Supabase
        const { error } = await _supabase
          .from('products')
          .update(payload)
          .eq('id', editId);

        if (error) alert('修改失敗: ' + error.message);
      } else {
        // 新增至 Supabase
        payload.isActive = true;
        const { error } = await _supabase
          .from('products')
          .insert([payload]);

        if (error) alert('新增失敗: ' + error.message);
      }

      resetForm();
      load();
    };

    // 切換上下架
    async function toggle(id, currentStatus) {
      const { error } = await _supabase
        .from('products')
        .update({ isActive: !currentStatus })
        .eq('id', id);

      if (error) alert('切換失敗');
      else load();
    }

    // 刪除商品
    async function del(id) {
      if (confirm('確定要刪除這項商品嗎？')) {
        const { error } = await _supabase
          .from('products')
          .delete()
          .eq('id', id);

        if (error) alert('刪除失敗');
        else load();
      }
    }

    async function logout() {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin-login.html';
    }

    // 改用 Supabase Storage (laopishop) 批次上傳圖片
    document.getElementById('imageFileInput').addEventListener('change', async function(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      const status = document.getElementById('uploadStatus');
      const imageUrlInput = document.getElementById('imageUrl');
      status.innerText = `⏳ 正在上傳 ${files.length} 張圖片，請稍候...`;

      const uploadedUrls = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

        try {
          // 上傳至 Supabase Storage 的 laopishop 儲存桶
          const { data, error } = await _supabase.storage
            .from('laopishop')
            .upload(fileName, file);

          if (error) throw error;

          // 取得該檔案的公開讀取網址
          const { data: publicUrlData } = _supabase.storage
            .from('laopishop')
            .getPublicUrl(fileName);

          if (publicUrlData && publicUrlData.publicUrl) {
            uploadedUrls.push(publicUrlData.publicUrl);
            status.innerText = `⏳ 已完成 ${i + 1}/${files.length} 張上傳...`;
          }
        } catch (err) {
          console.error('上傳單張失敗:', err);
        }
      }

      if (uploadedUrls.length > 0) {
        const currentUrls = imageUrlInput.value ? imageUrlInput.value.split(',') : [];
        const finalUrls = [...currentUrls, ...uploadedUrls].filter(Boolean);
        imageUrlInput.value = finalUrls.join(',');
        status.innerText = `✅ 成功上傳 ${uploadedUrls.length} 張圖片！`;
      } else {
        status.innerText = '❌ 上傳失敗，請重試';
      }
    });

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    check();
  </script>
</body>
</html>
