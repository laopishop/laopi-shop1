<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>老皮小店 LAOPI SHOP</title>
  <style>
    body { background-color: #0d0d0d; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; }
    .header { text-align: center; padding: 20px 0; border-bottom: 2px solid #d4af37; margin-bottom: 20px; }
    .header h1 { color: #d4af37; margin: 0; font-size: 24px; letter-spacing: 1px; }
    .header p { color: #aaa; font-size: 13px; margin-top: 5px; }

    .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
    .nav-btn { background: #1a1a1a; border: 1px solid #333; padding: 15px; border-radius: 8px; text-align: center; color: #fff; text-decoration: none; font-size: 14px; font-weight: bold; }

    .section-title { font-size: 18px; color: #ffc107; margin-bottom: 15px; border-left: 4px solid #ffc107; padding-left: 8px; }

    /* 商品列表 */
    .product-grid { display: flex; flex-direction: column; gap: 15px; }
    .product-card { background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .product-card:active { transform: scale(0.98); }
    .product-img { width: 100%; height: 200px; object-fit: cover; background: #222; }
    .product-info { padding: 15px; }
    .product-title { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #fff; }
    .product-desc-preview { font-size: 12px; color: #aaa; margin-bottom: 12px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .product-bottom { display: flex; justify-content: space-between; align-items: center; }
    .product-price { font-size: 18px; font-weight: bold; color: #ffd700; }
    .btn-action { background: linear-gradient(135deg, #ffe066, #f39c12); color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 13px; }

    /* 詳細資訊彈窗 Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
    .modal-content { background: #1a1a1a; width: 100%; max-width: 500px; max-height: 90vh; border-radius: 12px; border: 1px solid #d4af37; overflow-y: auto; padding: 15px; position: relative; box-sizing: border-box; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; color: #fff; cursor: pointer; z-index: 10; }

    /* 輪播圖 Gallery */
    .carousel { position: relative; width: 100%; height: 250px; background: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
    .carousel img { width: 100%; height: 100%; object-fit: contain; }
    .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: #fff; border: none; font-size: 18px; padding: 10px; cursor: pointer; border-radius: 4px; }
    .carousel-btn.prev { left: 5px; }
    .carousel-btn.next { right: 5px; }
    .dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
    .dot { width: 8px; height: 8px; background: #555; border-radius: 50%; cursor: pointer; }
    .dot.active { background: #ffd700; width: 18px; border-radius: 4px; }

    .modal-title { font-size: 18px; color: #fff; margin-bottom: 8px; font-weight: bold; }
    .modal-price { font-size: 20px; color: #ffd700; font-weight: bold; margin-bottom: 12px; }
    .modal-desc { background: #222; padding: 12px; border-radius: 6px; font-size: 13px; color: #ddd; line-height: 1.6; white-space: pre-wrap; margin-bottom: 15px; }
    .modal-contact-btn { display: block; width: 100%; text-align: center; background: linear-gradient(135deg, #ffe066, #f39c12); color: #000; text-decoration: none; padding: 12px 0; border-radius: 25px; font-weight: bold; font-size: 15px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>👑 老皮小店 LAOPI SHOP</h1>
    <p>👑 用心服務・誠信交易・安心首選 👑</p>
  </div>

  <div class="nav-grid">
    <div class="nav-btn">🔍 查詢帳號</div>
    <div class="nav-btn">🛒 購買流程</div>
    <div class="nav-btn">💳 付款方式</div>
    <div class="nav-btn">🛡️ 售後服務</div>
    <div class="nav-btn">📷 IG 賣場</div>
    <div class="nav-btn">👑 聯絡客服</div>
  </div>

  <div class="section-title">🔥 熱門精品帳號展售</div>
  <div class="product-grid" id="productGrid">
    <div style="text-align: center; color: #888; padding: 30px;">正在載入商品中...</div>
  </div>

  <!-- 詳情彈窗 Modal -->
  <div id="productModal" class="modal" onclick="closeModalOnBg(event)">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      
      <!-- 多圖輪播區塊 -->
      <div class="carousel" id="carouselBox">
        <img id="carouselImg" src="" alt="商品圖片">
        <button class="carousel-btn prev" onclick="changeImage(-1)">&#10094;</button>
        <button class="carousel-btn next" onclick="changeImage(1)">&#10095;</button>
      </div>
      <div class="dots" id="dotsBox"></div>

      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-price" id="modalPrice"></div>
      <div class="modal-desc" id="modalDesc"></div>
      <a id="modalContactBtn" href="https://line.me" target="_blank" class="modal-contact-btn">💬 立即私訊諮詢 / 購買</a>
    </div>
  </div>

  <script>
    let productsList = [];
    let currentImages = [];
    let currentImageIndex = 0;

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        productsList = await res.json();
        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = '<div style="text-align:center; color:#888;">載入失敗，請稍後重試</div>';
      }
    }

    function renderProducts() {
      const activeProducts = productsList.filter(p => p.isActive);
      const grid = document.getElementById('productGrid');

      if (activeProducts.length === 0) {
        grid.innerHTML = '<div style="text-align:center; color:#888; padding:30px;">目前尚無架上商品，請至後台新增！</div>';
        return;
      }

      grid.innerHTML = activeProducts.map(p => {
        const imgs = (p.imageUrl || '').split(',').filter(Boolean);
        const coverImg = imgs.length > 0 ? imgs[0] : 'https://via.placeholder.com/400x200?text=無圖片';

        return `
          <div class="product-card" onclick="openModal(${p.id})">
            <img class="product-img" src="${escapeHtml(coverImg)}" alt="${escapeHtml(p.name)}">
            <div class="product-info">
              <div class="product-title">${escapeHtml(p.name)}</div>
              <div class="product-desc-preview">${escapeHtml(p.description || '點擊查看詳細資訊與多圖照片')}</div>
              <div class="product-bottom">
                <div class="product-price">NT$ ${p.price}</div>
                <button class="btn-action">點擊看詳情</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(id) {
      const p = productsList.find(item => item.id === id);
      if (!p) return;

      currentImages = (p.imageUrl || '').split(',').filter(Boolean);
      if (currentImages.length === 0) currentImages = ['https://via.placeholder.com/400x200?text=無圖片'];
      currentImageIndex = 0;

      updateCarousel();

      document.getElementById('modalTitle').innerText = p.name;
      document.getElementById('modalPrice').innerText = `NT$ ${p.price}`;
      document.getElementById('modalDesc').innerText = p.description || '尚無詳細介紹說明。';

      document.getElementById('productModal').style.display = 'flex';
    }

    function updateCarousel() {
      document.getElementById('carouselImg').src = currentImages[currentImageIndex];
      
      // 顯示/隱藏 切換按鈕
      const prevBtn = document.querySelector('.carousel-btn.prev');
      const nextBtn = document.querySelector('.carousel-btn.next');
      if (currentImages.length <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      } else {
        prevBtn.style.display = 'block';
        nextBtn.style.display = 'block';
      }

      // 產生點點指示器
      const dotsBox = document.getElementById('dotsBox');
      dotsBox.innerHTML = currentImages.map((_, idx) => `
        <div class="dot ${idx === currentImageIndex ? 'active' : ''}" onclick="setImageIndex(${idx})"></div>
      `).join('');
    }

    function changeImage(direction) {
      currentImageIndex += direction;
      if (currentImageIndex < 0) currentImageIndex = currentImages.length - 1;
      if (currentImageIndex >= currentImages.length) currentImageIndex = 0;
      updateCarousel();
    }

    function setImageIndex(idx) {
      currentImageIndex = idx;
      updateCarousel();
    }

    function closeModal() {
      document.getElementById('productModal').style.display = 'none';
    }

    function closeModalOnBg(e) {
      if (e.target.id === 'productModal') closeModal();
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadProducts();
  </script>
</body>
</html>
